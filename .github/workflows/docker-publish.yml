name: Publish image

# Signing identity of the published image: this file at the release tag,
# https://github.com/BETER-CO/beter-feed-testing-sandbox/.github/workflows/docker-publish.yml@refs/tags/<tag>

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/beterco/beter-feed-testing-sandbox
  SOURCE_URL: https://github.com/BETER-CO/beter-feed-testing-sandbox

jobs:
  verify:
    name: Build, test, image and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Check out
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N"
            exit 1
          fi
          version="${TAG#v}"
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Version $version, pre-release $prerelease"

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Beter.Feed.TestingSandbox.sln

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build Beter.Feed.TestingSandbox.sln -c Release --no-restore "-p:Version=$VERSION"

      - name: Test (unit, contract, OpenAPI drift and version check, 50 % line coverage threshold)
        run: dotnet test Beter.Feed.TestingSandbox.sln -c Release --no-build --filter "Category!=smoke"

      - name: Vulnerability gate (direct and transitive packages)
        run: |
          set -euo pipefail
          dotnet list Beter.Feed.TestingSandbox.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable packages found"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (linux/amd64, local only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/Hosts/Beter.Feed.TestingSandbox.Server/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: beter-feed-testing-sandbox:ci

      - name: End-to-end test through the container
        env:
          SANDBOX_IMAGE: beter-feed-testing-sandbox:ci
          SANDBOX_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet test tests/Beter.Feed.TestingSandbox.EndToEndTests -c Release --no-build --filter "Category=smoke"

  publish:
    name: Push, sign, attest and verify
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      COMMIT: ${{ needs.verify.outputs.commit }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Same commit as the verify job
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$COMMIT" ]; then
            echo "::error::Checked out $head, verify job tested $COMMIT"
            exit 1
          fi

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ env.COMMIT }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.version=${{ env.VERSION }}
          annotations: |
            org.opencontainers.image.revision=${{ env.COMMIT }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/Hosts/Beter.Feed.TestingSandbox.Server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      # The pushed image is a new build of the commit the verify job tested. It is run
      # and read back before it is signed, so a signature always names a tested image.
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: End-to-end test through the pushed image (linux/amd64)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SANDBOX_VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE}@${DIGEST}"
          SANDBOX_IMAGE="${IMAGE}@${DIGEST}" dotnet test tests/Beter.Feed.TestingSandbox.EndToEndTests -c Release --filter "Category=smoke"

      - name: Labels of the pushed image name the commit and the repository
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          revision="$(docker image inspect "${IMAGE}@${DIGEST}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          source="$(docker image inspect "${IMAGE}@${DIGEST}" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')"
          echo "revision=$revision source=$source"
          if [ "$revision" != "$COMMIT" ] || [ "$source" != "$SOURCE_URL" ]; then
            echo "::error::Image labels do not name commit $COMMIT and $SOURCE_URL"
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image by digest (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Verify signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${SOURCE_URL}/.github/workflows/docker-publish.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Verify provenance attestation from Docker Hub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "oci://${IMAGE}:${VERSION}" \
            --owner BETER-CO \
            --bundle-from-oci \
            --signer-workflow BETER-CO/beter-feed-testing-sandbox/.github/workflows/docker-publish.yml \
            --source-ref "refs/tags/${TAG}" \
            --source-digest "${COMMIT}"

      # A pre-release never moves latest; a release moves it only after the image is
      # tested, signed, attested and verified. The tag points at the same digest.
      - name: Move latest to the verified release
        if: needs.verify.outputs.prerelease == 'false'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${DIGEST}"

      - name: Job summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          {
            echo "## Published image"
            echo ""
            echo "- Image: \`${IMAGE}:${VERSION}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Pinned reference: \`${IMAGE}@${DIGEST}\`"
            if [ "$PRERELEASE" = "false" ]; then echo "- \`latest\` moved to this digest"; fi
            echo "- Source commit: \`${COMMIT}\`"
            echo ""
            echo "### Verify the signature"
            echo ""
            echo '```sh'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity \"${SOURCE_URL}/.github/workflows/docker-publish.yml@refs/tags/${TAG}\" \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo ""
            echo "### Verify the build provenance"
            echo ""
            echo '```sh'
            echo "gh attestation verify oci://${IMAGE}:${VERSION} --owner BETER-CO \\"
            echo "  --bundle-from-oci \\"
            echo "  --signer-workflow BETER-CO/beter-feed-testing-sandbox/.github/workflows/docker-publish.yml \\"
            echo "  --source-ref refs/tags/${TAG} \\"
            echo "  --source-digest ${COMMIT}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
