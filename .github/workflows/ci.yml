name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent-feed-integration

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test, image and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Beter.Feed.TestingSandbox.sln

      - name: Build
        run: dotnet build Beter.Feed.TestingSandbox.sln -c Release --no-restore

      - name: Test (unit, contract, OpenAPI drift check, 50 % line coverage threshold)
        run: dotnet test Beter.Feed.TestingSandbox.sln -c Release --no-build --filter "Category!=smoke"

      - name: Vulnerability gate (direct and transitive packages)
        run: |
          set -euo pipefail
          dotnet list Beter.Feed.TestingSandbox.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable packages found"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (linux/amd64, local only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/Hosts/Beter.Feed.TestingSandbox.Server/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: beter-feed-testing-sandbox:ci

      - name: End-to-end test through the container
        env:
          SANDBOX_IMAGE: beter-feed-testing-sandbox:ci
        run: dotnet test tests/Beter.Feed.TestingSandbox.EndToEndTests -c Release --no-build --filter "Category=smoke"
